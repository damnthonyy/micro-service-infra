openapi: 3.0.0
paths:
  /health:
    get:
      description: Returns API information and available endpoints
      operationId: RootController_getRoot
      parameters: []
      responses:
        '200':
          description: API information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfoResponseDto'
      security:
        - bearer: []
      summary: API Information
      tags:
        - Health
  /products/create:
    post:
      description: Creates a new product in the system
      operationId: ProductController_createProduct
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDto'
      responses:
        '200':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseProductDto'
        '400':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security: &ref_0
        - bearer: []
      summary: Create a new product
      tags: &ref_1
        - products
  /products/{id}:
    put:
      description: Updates an existing product by its ID
      operationId: ProductController_updateProduct
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductDto'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseProductDto'
        '400':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security: *ref_0
      summary: Update a product by id
      tags: *ref_1
    delete:
      description: Deletes a product by its ID
      operationId: ProductController_deleteProduct
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Product deleted successfully
        '400':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security: *ref_0
      summary: Delete a product by id
      tags: *ref_1
  /users/validate:
    post:
      description: Validates user credentials and returns user details
      operationId: UserController_validateUser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateUserDto'
      responses:
        '200':
          description: User validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseUserDto'
        '400':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security: &ref_2
        - bearer: []
      summary: Validate user credentials
      tags: &ref_3
        - users
  /users/create:
    post:
      description: Creates a new user in the system
      operationId: UserController_createUser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseUserDto'
        '400':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security: *ref_2
      summary: Create a new user
      tags: *ref_3
  /users/{id}:
    put:
      description: Updates an existing user by its ID
      operationId: UserController_updateUser
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseUserDto'
        '400':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security: *ref_2
      summary: Update a user by id
      tags: *ref_3
    delete:
      description: Deletes a user by its ID
      operationId: UserController_deleteUser
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '400':
          description: An unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security: *ref_2
      summary: Delete a user by id
      tags: *ref_3
info:
  title: Backend Microservice Infra Boilerplate
  description: Backend Microservice Infra Boilerplate
  version: 1.0.0
  contact: {}
tags:
  - name: users
    description: User management endpoints
  - name: products
    description: Product management endpoints
  - name: Health
    description: API health and information endpoints
servers:
  - url: http://localhost:3000
    description: Local development server
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiInfoResponseDto:
      type: object
      properties:
        message:
          type: string
          example: Welcome to Backend Microservice Infra Boilerplate API
        version:
          type: string
          example: 1.0.0
        documentation:
          type: string
          example: /docs
        endpoints:
          type: object
          example:
            users: /users
            products: /products
            swagger: /docs
      required:
        - message
        - version
        - documentation
        - endpoints
    CreateProductDto:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Product Name
        price:
          type: number
          example: 10
        description:
          type: string
          example: Product Description
        stock:
          type: number
          example: 10
      required:
        - id
        - name
        - price
        - description
        - stock
    ResponseProductDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        description:
          type: string
        stock:
          type: number
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        deletedAt:
          type: object
          nullable: true
      required:
        - id
        - name
        - price
        - description
        - stock
        - createdAt
        - updatedAt
        - deletedAt
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          type: string
          example: Bad Request
        error:
          type: string
          example: Validation failed
      required:
        - statusCode
        - message
        - error
    UpdateProductDto:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        price:
          type: number
          example: 10
        stock:
          type: number
          example: 10
      required:
        - id
        - price
        - stock
    ValidateUserDto:
      type: object
      properties:
        email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          example: password
      required:
        - email
        - password
    ResponseUserDto:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@example.com
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt
    CreateUserDto:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          example: password
      required:
        - name
        - email
        - password
    UpdateUserDto:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: John Doe
        password:
          type: string
          example: password
      required:
        - id
        - name
        - password
